name: yokku_mbey
description: Application Flutter Yokku Mbey Agri Acheteur.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  image_picker: ^1.2.3
  image: ^4.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto-regular.ttf
        - asset: assets/fonts/roboto-medium.ttf
          weight: 500
        - asset: assets/fonts/roboto-bold.ttf
          weight: 700
        - asset: assets/fonts/roboto-black.ttf
          weight: 900
  assets:
    - assets/images/splash_screen.png
    - assets/images/splash_screen_1.png
    - assets/images/splash_screen_2.png
    - assets/images/splash_screen_3.png
    - assets/images/onboarding_farmer_light.png
    - assets/images/service_tractor_demo.png
    - assets/images/onboarding_background.png
    - assets/images/senegal.png
    - assets/images/google.png
    - assets/images/logo_yokku_mbey.png
    - assets/images/buyer_tomato.png
    - assets/images/buyer_onion.png
    - assets/images/buyer_potato.png
    - assets/images/buyer_corn.png
    - assets/images/buyer_home_avatar.png
    - assets/images/buyer_home_tomato.png
    - assets/images/buyer_home_onion.png
    - assets/images/buyer_purchase_tomato.png
    - assets/images/buyer_purchase_onion.png
    - assets/images/buyer_purchase_potato.png
    - assets/images/farmer_tomato_harvest.png
    - assets/images/farmer_home_background.png
    - assets/images/farmer_profile_background.png
    - assets/images/harvest_tomato_detail.png
    - assets/images/farmer_profile.png
